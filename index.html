<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Experiencia em HTML"> 
    <title>Aulas de HTML</title>

    <style>
        body{
            background-color: burlywood;
        }
        h1{
            background-color: white;
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-align: center;
            border-radius: 18px;
            padding: 14px;
            display: inline-block;
        }
        .primeiro_comando{
            background-color: aquamarine;
            padding: 2px;
            border-radius: 10px;
            text-align: center;
        }

        h3{
            background-color: darkmagenta;
            font-family: Arial, Helvetica, sans-serif;
            display: inline-flex;
            border-radius: 8px;
            padding: 12px;
        }
        .autor{
            background-color: rgb(170, 70, 193);
            border-radius: 10px;
            padding: 18px; 
            display: inline-block;
        }
        .eleicoes{
            background-color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>AULA SOBRE HTM</h1>
    <div class="primeiro_comando">
        <h2>O meu primeiro comando HTML</h2>
    </div>
    <h3>Notícias de Ùltima Horas</h3>
    <p class="eleicoes">A CNE da Guiné-Bissau acaba de anunciar os resultados eleitorais e DOMINGOS SIMÔES PEREIRA é eleito presidente da república da Guiné-Bissau</p>
    <p class="autor"> <strong>Por:</strong> Marciano Bifa Có</p>
</body>
</html>
